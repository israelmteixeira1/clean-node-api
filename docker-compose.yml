services:
  mongo:
    image: mongo:5
    restart: unless-stopped
    volumes:
      - ./data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  api:
    image: node:22
    working_dir: /usr/src/clean-node-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/clean-node-api}
    command: sh -c "npm ci --omit=dev && npm start"
    volumes:
      - ./dist:/usr/src/clean-node-api/dist:ro
      - ./package.json:/usr/src/clean-node-api/package.json:ro
      - ./package-lock.json:/usr/src/clean-node-api/package-lock.json:ro
    ports:
      - "5050:5050"
    depends_on:
      mongo:
        condition: service_healthy
